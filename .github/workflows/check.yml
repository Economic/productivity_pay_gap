# The PR check (Phase 3 of plans/2026-10-21-ci-data-release-workflow.md).
# Rebuilds everything offline from the committed raw data, with the package
# versions in renv.lock, and fails if the result differs from the committed
# files. The change report is built afterward and can't fail the check.
name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check (default, the commit that triggered the run)
        type: string
        default: ""
      baseline:
        description: Git ref the change report compares with
        type: string
        default: origin/main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    env:
      TAR_PROJECT: offline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # full history and tags, for the change report
          fetch-depth: 0
          # the PR's own code runs later, and no step needs git credentials
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: renv

      # System libraries that some of the prebuilt R packages link to (igraph
      # needs libglpk, for example), as listed by renv::restore(). cmake and
      # pandoc, also listed, are needed only to compile packages or render
      # documents.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev libglpk-dev libx11-dev

      - uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        env:
          # renv installs epidatatools and epitargets from GitHub
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild offline from the committed raw data
        run: Rscript -e 'targets::tar_make(names = !change_report)'

      - name: Fail if the rebuild differs from the committed files
        run: |
          if [ -n "$(git status --porcelain -- data_final data_outputs)" ]; then
            echo "::error::The offline rebuild differs from the committed files. Rebuild in offline mode (TAR_PROJECT=offline) and commit the result."
            git status --short -- data_final data_outputs
            git diff --stat -- data_final data_outputs
            exit 1
          fi

      - name: Check report comparisons
        if: ${{ github.event_name == 'pull_request' }}
        # Report checks are informational too. A fixture failure must not
        # prevent the report itself from being built and posted.
        continue-on-error: true
        run: Rscript tests/report-comparisons.R

      # Runs only if the check passed: otherwise the working tree holds the
      # rebuilt files, not the committed ones
      - name: Build the change report
        id: report
        continue-on-error: true
        env:
          PPG_BASELINE: ${{ inputs.baseline || github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before) || 'origin/main' }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            release_tag=$(gh release view --json tagName --jq .tagName)
            export PPG_RELEASE_BASELINE="$release_tag"
          fi
          Rscript -e 'targets::tar_make(names = change_report)'

      # When the release workflow calls this check (with a ref), its change
      # report against the previous release becomes the release notes
      - name: Keep the change report for the release
        if: ${{ steps.report.outcome == 'success' && inputs.ref != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: change-report
          path: reports/change_report.md
          retention-days: 7

      - name: Publish the change report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$REPORT_OUTCOME" != "success" ]; then
            echo 'The change report could not be built; see the "Build the change report" step.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat reports/change_report.md >> "$GITHUB_STEP_SUMMARY"
          # PRs from forks get a read-only token, so comment only on PRs from
          # this repo. Refresh PRs carry the report already, and --edit-last
          # would overwrite the refresh workflow's latest weekly comment.
          if [ -n "$PR_NUMBER" ] && [ "$SAME_REPO" = "true" ] && [ "$HEAD_REF" != "data-refresh" ]; then
            # Keep both comparisons even when the PR introduces no data changes:
            # main can still contain changes since the last release.
            gh pr comment "$PR_NUMBER" --body-file reports/change_report.md --edit-last --create-if-none
          fi
