# .roborev.toml
#
# Adapted from ~/projects/bls-index/.roborev.toml on 2026-10-21.
#
# Naming convention: names ending in _reviewer or _panel are labels chosen for this
# repo. roborev attaches no meaning to them; they only connect the sections below.
# Everything else (section names, keys, and values such as review_type = "design")
# is roborev's own vocabulary.

# ---- Default agent (used by manual `roborev review` without --panel) ----
agent = "codex"
model = "gpt-6.1-sol"
review_reasoning = "high"

# ---- Which agent runs `--type design` reviews ----
design_agent = "codex"
design_model = "gpt-6.1-sol"

# ---- Review behavior ----
review_min_severity = "medium"
auto_close_passing_reviews = true

# Review each commit in a temporary daemon-owned checkout of that commit, so
# reviewers never see uncommitted edits, untracked files, or later work.
# (`roborev review --dirty` still uses the live working tree.)
isolate_reviews = true

# Files left out of review diffs (added to roborev's built-in exclusions).
# Reviewers can still open them in the review checkout. Security reviews ignore
# this list by design.
# - renv.lock, renv/ and _targets/ are generated by tools.
# - The large data files change by thousands of lines with every data update, and
#   the change report explains those changes. The small final files (web data, web
#   stats, sources) stay in diffs, so reviewers can see when a code change moves the
#   numbers.
# - Data files are listed by file name, not path, so the patterns still match after
#   the plan's Phase 1 moves them to data_raw/ and data_final/.
exclude_patterns = [
  "renv.lock",
  "renv/",
  "_targets/",
  "data_outputs/",
  "bls_api_output.csv",
  "bea_api_output.csv",
  "epi_productivity_pay_gap.csv",
]

review_guidelines = """
Project context: this repository produces EPI's productivity-pay gap data: real
productivity and real hourly compensation of production and nonsupervisory workers,
1948 to the present, indexed to 1948q1 = 100. EPI's website and the State of Working
America Data Library publish the numbers, and journalists and policymakers cite them.
The main harm is a wrong number in a published release. Releases are manual: the
maintainer reads a change report and decides. The weekly refresh run and merges to
main never publish anything, and files on main may be ahead of the latest release.
Weigh every finding against those stakes.

Project artifacts:
- The current plan is the newest dated file in plans/. Its "Decisions made" and
  "Resolved questions" sections are settled. Challenge them only with a genuinely new
  argument, and do not report a risk the plan accepts as a defect.
- README.md documents the methodology and data sources. AGENTS.md describes how work
  is done here, including the core calculations.
- R/ and _targets.R are the pipeline. data_inputs/ holds static inputs. The other data
  folders hold pipeline outputs, committed so that changes can be reviewed.

What to flag:
- Anything that can change published numbers unintentionally: wrong series, table
  lines or frequencies; years or quarters misaligned in joins; errors in the pre-1964
  wage splice or the interpolation; the wrong deflator or base period; rounding or
  growth-rate arithmetic in the web stats.
- Calculation changes (in R/combine.R, R/bls.R, R/prices.R or R/web.R) that neither
  the commit message nor the plan describes as an intended methodology change. These
  are high severity.
- targets dependencies that miss an input, so that tar_make() can serve stale results.
- Provenance errors: dates or versions in the sources CSV that don't match the data
  actually used.
- GitHub Actions security: secrets printed or reachable from pull requests opened from
  forks; pull_request_target; permissions broader than a job needs; untrusted text
  (PR titles, branch names, commit messages) interpolated into run: scripts.
- Complexity the stakes do not justify: speculative features, defensive checks of
  internal invariants, duplicated validation, and tests that pin incidental details
  such as exact error text. Recommending that a requirement, check, or test be
  deleted is a valid finding.
- Deviations from the plan, and changes that add requirements the plan does not ask
  for.

What not to flag:
- A commit that changes code without rebuilding the committed outputs. The pull
  request check rebuilds offline and catches this.
- Failures that the next weekly run or a manual rerun repairs, unless they can put
  wrong numbers into a release.
- Failures that need two or more unusual conditions at once, unless they can put
  wrong numbers into a release.
- Revised values in data files after a data update. Revisions are expected, and the
  change report explains them.
- Wording, formatting, and R style, unless meaning changes.

High-severity rules:
- A release must attach exactly the final data files at the tagged commit, and only
  after the offline rebuild check passes on that commit.
- Secrets (BLS_API_KEY, BEA_API_KEY, BLS_DOWNLOAD_EMAIL) must never be printed or
  exposed to untrusted code.

The offline rebuild (PPG_OFFLINE=true, added in Phase 1 of the plan) must run without
network access or credentials.

renv.lock, renv/, _targets/ and the large data files are excluded from diffs. When a
change touches packages, open renv.lock in the checkout. When a change touches
calculations, check that the small final files in the diff (web data, web stats,
sources) move the way the change intends.
"""

# ---- Reviewers (subagents) ----
[review.subagents.codex_code_reviewer]
review_type = "default"   # roborev's standard correctness review
agent = "codex"
model = "gpt-6.1-sol"
reasoning = "high"

[review.subagents.claude_code_reviewer]
review_type = "default"
agent = "claude-code"
model = "opus"
reasoning = "high"

[review.subagents.codex_design_reviewer]
review_type = "design"    # roborev's design-focused review
agent = "codex"
model = "gpt-6.1-sol"
reasoning = "high"

[review.subagents.codex_security_reviewer]
review_type = "security"  # roborev's security-focused review
agent = "codex"
model = "gpt-6.1-sol"
reasoning = "high"

# ---- Panels (groups of reviewers) ----
# Runs on every commit (see hook_review_panel below).
[review.panels.every_commit_panel]
members = ["codex_code_reviewer"]

# Manual, at the end of each plan phase:
#   roborev review --branch --base main --panel checkpoint_panel --wait
# The security reviewer matters most for .github/workflows/, where the secrets and
# the release write permission live.
[review.panels.checkpoint_panel]
members = ["codex_code_reviewer", "claude_code_reviewer", "codex_design_reviewer",
           "codex_security_reviewer"]
synthesis_agent = "codex"
synthesis_model = "gpt-6.1-sol"

# Manual design review, for example of a new plan.
[review.panels.design_only_panel]
members = ["codex_design_reviewer"]

[review]
hook_review_panel = "every_commit_panel"

# ---- Automatic extra design review on post-commit hooks ----
# Off, as in bls-index: run design reviews by hand at milestones instead
# (roborev review --branch --panel design_only_panel).
[auto_design_review]
hook_enabled = false
